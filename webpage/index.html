<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GC Advising Center</title>
  <meta
    name="description"
    content="GC Advising Center with workshop materials, advisor profiles, weekday evening duty schedule, and Piazza access."

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
